<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#14213d"/>
      <stop offset="1" stop-color="#3b5bdb"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3b5bdb"/>
      <stop offset="1" stop-color="#8fb0ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#5c7cfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5c7cfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="240" rx="16" fill="url(#bg)"/>
  <rect width="900" height="240" rx="16" fill="url(#glow)"/>

  <!-- code brackets -->
  <text x="40" y="120" font-family="Consolas, 'Courier New', monospace" font-size="90" fill="#ffffff" opacity="0.07">&lt;/&gt;</text>
  <text x="690" y="120" font-family="Consolas, 'Courier New', monospace" font-size="90" fill="#ffffff" opacity="0.07">{ }</text>

  <!-- title -->
  <text x="450" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#ffffff">Lapalu Liyanage</text>
